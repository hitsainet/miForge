# The WSP worker (feature 016; FTDD §8.1, FTID §3.2): the one place miForge runs code it did not
# write - an editor LLM's tool calls and programs, through miStudio's own engine, `miwsp_engine`
# (the `weightspace` library until its retirement, feature 018 FTASKS 15.2).
#
# CONTAINMENT IS THIS FILE. Every security line below is pinned by its own test in
# backend/tests/unit/wsp/test_wsp_worker_containment.py, and deleting any one of them turns exactly
# that test red (controls C10a-C10m). In short:
#   - no credential (D20): the env is a literal list with no secretKeyRef, no envFrom, no Secret
#     volume; the one secret a session ever sees is its gateway token, written to the child's stdin;
#   - no Kubernetes permission (D14): no service account token, no serviceAccountName, no RBAC;
#   - no network but the gateway (P49): wsp-networkpolicy.yaml; and no DNS (P37): dnsPolicy None;
#   - its own uid 10002 (not the backend's 10001), a read-only root, seccomp RuntimeDefault, every
#     capability dropped, no host namespace, its own PID namespace;
#   - the supervisor is PID 1 and serves ONE session per process: after the result is pulled and
#     acknowledged it wipes /work, /out, /tmp, /dev/shm and IPC, and exits; Kubernetes restarts it
#     with a fresh boot_id (P49, P51).
#
# Feature 019 P3 (F19-D5, D18, D22): a StatefulSet; each pod is one worker, addressed on its own as
# miforge-wsp-worker-<i>.miforge-wsp-workers (the headless Service below), never through a
# load-balanced name. `replicas` is the provisioned maximum and equals WSP_WORKER_POOL_MAX in
# config.yaml (test_wsp_worker_containment.py); the runtime setting wsp_pool_size chooses how many
# of them are used. RollingUpdate replaces pods one at a time, in reverse ordinal order, so at one
# replica it behaves as the Deployment's Recreate did; a rollout still kills a running session.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: miforge-wsp-worker
  namespace: miforge
  labels:
    app.kubernetes.io/name: miforge-wsp-worker
    app.kubernetes.io/component: wsp-worker
spec:
  # The provisioned maximum (F19-D5, F19-D22): equal to WSP_WORKER_POOL_MAX in config.yaml.
  replicas: 2
  serviceName: miforge-wsp-workers
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: miforge-wsp-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miforge-wsp-worker
        app.kubernetes.io/component: wsp-worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.1"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: supervisor
          image: hitsai/miforge-wsp-worker:latest
          imagePullPolicy: IfNotPresent
          args: ["supervisor"]
          ports:
            - name: supervisor
              containerPort: 9000
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: WSP_WORKER_PORT
              value: "9000"
            - name: WSP_ENVIRONMENT
              value: prod
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          terminationMessagePath: /tmp/termination-log
          terminationMessagePolicy: File
          livenessProbe:
            httpGet:
              path: /ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 6Gi
              # Above the `work` emptyDir's sizeLimit (64Gi) so the volume, not this, is what binds:
              # the pod's ephemeral total is /work plus logs (the root is read-only and the other
              # volumes are Memory-backed). Production defect 2026-11-20: 10Gi with an 8Gi /work
              # evicted the worker mid-push of a 35 GB bundle.
              ephemeral-storage: 72Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: out
              mountPath: /out
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        # /work holds every pushed file (a phase-2 bundle is ~35 GB) plus the session's own files.
        # Provisioned, not a design limit (suite rule: storage does not constrain design). Equal to
        # WSP_WORKER_WORK_BYTES in config.yaml (test_wsp_worker_work_volume.py); the backend refuses
        # a run that cannot fit (wsp_bundle_too_large_for_worker) and sets the disk watchdog 4 GiB
        # below it (backend/src/wsp/capacity.py).
        - name: work
          emptyDir:
            sizeLimit: 64Gi
        - name: out
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
# The driver addresses each worker by its own name (FR-019.7): miforge-wsp-worker-<i>.miforge-wsp-workers.
# Headless, so no load-balanced name exists; published while not ready, so a worker's name survives
# the container restart at the end of every session. Replaces 016's ClusterIP Service
# miforge-wsp-worker, which ArgoCD does not prune: the operator deletes it by hand after the sync.
apiVersion: v1
kind: Service
metadata:
  name: miforge-wsp-workers
  namespace: miforge
  labels:
    app.kubernetes.io/name: miforge-wsp-worker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: miforge-wsp-worker
  ports:
    - name: supervisor
      port: 9000
      targetPort: 9000
