# Alembic configuration  (foundation task 4.2; ADR-003)
#
# The URL is NOT here. `backend/alembic/env.py` reads it from `core.config.get_settings()`,
# so there is one source of truth for the database URL and no credential in a tracked file
# (ADR-020). Overriding it for a one-off run is `alembic -x url=... upgrade head`.

[alembic]
script_location = backend/alembic
prepend_sys_path = backend/src
path_separator = os
# Timestamped, ordered filenames: a backlog of migrations has to read in the order it
# applies, and `0001_`-style counters collide the moment two branches add one.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
