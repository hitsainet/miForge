# nginx for hitsai/miforge-frontend (foundation task 8.2).
#
# Serves the built React app and PROXIES THE API, so the browser only ever talks to one
# origin. That is not cosmetic: ADR-022 fences miForge's core path off every sibling
# endpoint, and a browser `fetch` is on that path — there is exactly one host the UI may
# address, and it is miForge's own. `frontend/vite.config.ts` does the same thing for the
# dev server, and the two must stay in step.
#
# Port 8080, uid 101: the base image is `nginxinc/nginx-unprivileged`, which cannot bind
# a privileged port. Matching miDataworks' frontend rather than miLLM's, which runs
# nginx as root on 80.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ⚠ THE UPSTREAM HOSTNAME IS THE SAME IN BOTH ENVIRONMENTS, DELIBERATELY.
    # In Kubernetes it is the `miforge-backend` Service (gitops/pilot/backend.yaml); in
    # docker-compose the backend service carries `miforge-backend` as a NETWORK ALIAS
    # for exactly this reason. One literal here beats an envsubst template whose
    # substitution failing would leave nginx proxying to an empty string.
    #
    # ⚠ A LITERAL UPSTREAM IS RESOLVED AT CONFIG LOAD, AND NGINX REFUSES TO START IF IT
    # CANNOT BE RESOLVED. Verified, not assumed — `nginx -t` on this file outside a
    # cluster fails with:
    #
    #     [emerg] host not found in upstream "miforge-backend"
    #
    # and succeeds with the name replaced by an address. That is acceptable here: the
    # `miforge-backend` Service is in the same kustomization, ArgoCD applies Services
    # before Deployments, and a Service name resolves whether or not it currently has
    # endpoints. But it does mean THIS CONTAINER CANNOT START WITHOUT THAT SERVICE, so
    # deleting or renaming it turns a backend problem into a frontend crash-loop.
    #
    # ── A DELIBERATE DIVERGENCE FROM THE SUITE, WORTH KNOWING ──────────────────────
    # miDataworks' frontend nginx proxies NOTHING: its header says "the ingress routes
    # /api/ to the backend, so nothing here proxies". That is the better arrangement and
    # it is where this should end up. It is not done yet because miForge HAS NO INGRESS
    # — a hostname and TLS are operator decisions and foundation task 8.5 does not ask
    # for one. Until there is one, proxying here is what makes the UI reachable through
    # `kubectl port-forward svc/miforge-frontend 8080:80` alone.
    #
    # MIGRATING IS A DELETION, NOT A REWRITE: add the ingress, then delete the two
    # `location` blocks below. Nothing else in this file depends on them.

    location /api/ {
        proxy_pass http://miforge-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A training run is hours long and the run view streams for all of it. The
        # default 60 s read timeout would cut a long poll; this is the fallback path
        # the run store uses when the socket drops (ADR-013), so it must outlive a
        # generation-bound test pass or a 2.4 GB save.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /socket.io/ {
        proxy_pass http://miforge-backend:8000;
        proxy_http_version 1.1;
        # The three headers a WebSocket upgrade needs. Without them Socket.IO silently
        # falls back to long-polling and the run view looks slow rather than broken,
        # which is the harder failure to diagnose.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;
    }

    # The container's own liveness. Served by nginx itself, so it answers while the
    # backend is down — a frontend that reports itself unhealthy because the API is
    # unhealthy gets restarted for someone else's fault.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Compression. ⚠ ABSENT UNTIL 2026-10-14, so every byte of the bundle went out
    # uncompressed - miStudio and miDataworks both enable it and this file simply never
    # did. `image/svg+xml` is in the list because the tab mark is an SVG (see below) and
    # because miDataworks' own favicon test asserts that type is compressed.
    # `gzip_vary` so a shared cache does not hand a gzipped body to a client that cannot
    # read it.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Hashed build assets are immutable; `index.html` must never be cached or a deploy
    # leaves browsers loading the old bundle against the new API.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ── ROOT-LEVEL ICONS: THE ONE PLACE THE SPA FALLBACK IS ACTIVELY WRONG ─────────
    #
    # `location /`'s `try_files $uri $uri/ /index.html` is right for every client-side
    # route and wrong for a file the BROWSER fetches on its own. A browser asks for
    # `/favicon.ico` and `/apple-touch-icon.png` whether or not the document links them,
    # and the fallback answered both with **index.html at 200 and `text/html`** - an HTML
    # document described as an image. That fails SILENTLY: nothing in the access log looks
    # wrong, no broken-image glyph appears, the tab just shows the browser's default mark.
    # It is the exact shape of failure this project keeps paying for - a green measurement
    # of something that never happened.
    #
    # `=404` is the fix, and it is the fix for the files that EXIST as much as for the ones
    # that do not: it means a renamed or un-copied icon says so, instead of being masked by
    # a 200. `public/apple-touch-icon.png` and `public/favicon.ico` are deliberately not
    # shipped (no rasteriser - see `index.html`), so those two now 404 honestly.
    #
    # ⚠ THESE FILES ARE NOT CONTENT-HASHED, unlike `/assets/`, so `immutable` and a
    # one-year expiry would strand a changed logo in every cache that saw the old one.
    # Seven days revalidates often enough for a mark that changes about never, while still
    # keeping it out of the request path on ordinary navigation. A regex `location` is
    # evaluated before the `/` prefix match and after the two `=` exact matches above, so
    # ordering within this file is not load-bearing - but it is placed here, before
    # `location /`, so a reader meets it in the order nginx resolves it.
    location ~ ^/(favicon\.svg|favicon\.ico|apple-touch-icon(-precomposed)?\.png|manifest\.webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback, LAST so it cannot shadow the proxied prefixes above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
